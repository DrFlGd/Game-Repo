[dependencies.kqueue-sys]
version = "^1.1.1"

[dependencies.libc]
version = "^0.2.17"

[dev-dependencies.criterion]
features = ["html_reports"]
version = "0.5"

[dev-dependencies.dhat]
version = "0.3.2"

[dev-dependencies.tempfile]
version = "3.1.0"

[lib]
path = "src/lib.rs"

[lints.clippy]
print_stderr = "deny"
print_stdout = "deny"

[package]
authors = ["William Orr <will@worrbase.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["os::unix-apis", "filesystem"]
description = "kqueue interface for BSDs"
documentation = "https://docs.worrbase.com/rust/kqueue/"
edition = "2021"
exclude = [".builds"]
keywords = ["kqueue", "kevent", "bsd"]
license = "MIT"
name = "kqueue"
readme = "README.md"
repository = "https://gitlab.com/rust-kqueue/rust-kqueue"
version = "1.2.1"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-netbsd", "x86_64-unknown-freebsd", "i686-unknown-freebsd", "x86_64-unknown-dragonfly", "x86_64-unknown-openbsd", "aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-apple-ios", "x86_64-apple-ios"]

[profile.bench]
debug = 2
