name: Desktop

# Builds the desktop app (Tauri) for Windows, runs the Rust tests and the acceptance
# test (the page against the app's real backend), drives the app through WebDriver,
# and when everything passes on main publishes a numbered release (v0.0.0, v0.0.1,
# ...; see tools/set_version.py) with notes taken from CHANGELOG.md's Unreleased
# section. Windows is the only platform for now (decision D3, docs/PLAN.md):
# the Linux app and the Linux-to-Windows library check run only when asked for, from
# Run workflow with "Linux too" ticked. Reports and screenshots go to the
# desktop-ci-<os> branches (a pull request's to desktop-ci-<os>-pr). The token is
# read-only except in the two jobs that write (reports and release), which run no build
# or test code; actions are pinned to commits and tools to exact versions. Only a push
# to main publishes: Run workflow on main builds and tests but doesn't publish again.
# A push whose files a pull request's run already built and tested on Windows, for the
# same version, publishes that run's installer instead of building and testing again
# (the "Already tested" job); any difference, such as another merge in between, runs
# everything.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "web/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/desktop.yml"
  # a pull request that changes only the plan, other docs or CHANGELOG.md builds nothing,
  # as such a push to main publishes nothing
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "web/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      linux:
        description: "Linux too (the Linux app and the Linux-to-Windows library check)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  version:
    name: Release number
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - id: version
        run: |
          v=$(python3 tools/set_version.py --next)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::$v"

  tested:
    name: Already tested
    needs: version
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # lists other runs' artifacts
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          # the Windows job's last step names what it passed with: these files (their git tree)
          # and this version. Only a run from this repository's own branches counts (a fork's
          # pull request could name any files), and only while its installer is kept.
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
          name="tested-$tree-$V"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name" \
            --jq '.artifacts[] | select(.expired | not) | .workflow_run | select(.head_repository_id == ${{ github.repository_id }}) | .id')
          for run in $runs; do
            [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .path)" = .github/workflows/desktop.yml ] || continue
            kept=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select(.name == "bundles-windows" and (.expired | not))] | length')
            [ "$kept" = 1 ] || continue
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already tested::run $run built and tested these files as $V: publishing its installer"
            exit 0
          done
          echo "::notice title=Not tested yet::no run built and tested these files as $V: building and testing"

  linux:
    name: Linux app
    needs: version
    if: github.event_name == 'workflow_dispatch' && inputs.linux
    runs-on: ubuntu-22.04   # oldest supported: the AppImage then runs on newer systems too
    timeout-minutes: 60
    defaults:
      run: { shell: bash }   # -o pipefail, so "cmd | tee log" fails when cmd fails
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: System packages
        run: |
          sudo apt-get update -q
          # mame-tools: chdman, for the test that checks the CHDs written here (review M46)
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xvfb webkit2gtk-driver mame-tools
          pip install selenium==4.51.0 playwright==1.64.0
          python -m playwright install --with-deps chromium 2>&1 | tail -2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: desktop }
      - name: Version ${{ needs.version.outputs.version }}
        run: python tools/set_version.py "${{ needs.version.outputs.version }}"
      - name: Check and test the Rust code
        working-directory: desktop
        env:
          GAMEREPO_TEST_CHDMAN: "1"   # chdman is installed: its test must run (review M46)
        run: |
          mkdir -p ../ci-out
          cargo build --release -p gamerepo-core 2>&1 | tee ../ci-out/core-build.log
          cargo test --release -p gamerepo-core 2>&1 | tee ../ci-out/core-test.log
          # the performance targets of docs/PLAN.md (100k-file rescan, 50k-ROM DAT), on generated data
          cargo test --release -p gamerepo-core -- --ignored timing --nocapture --test-threads=1 2>&1 | tee ../ci-out/core-timing.log
          # every timing test ran: a filter that matches none passes too (review M46)
          want=$(grep -rhoE "fn timing_[a-z0-9_]+" core/src | sort -u | wc -l)
          ran=$(grep -oE "test result: ok\. [0-9]+ passed" ../ci-out/core-timing.log | awk '{n += $4} END {print n + 0}')
          echo "timing tests: $ran of $want"
          [ "$ran" -eq "$want" ] || { echo "::error title=Timing tests::$ran of the $want timing tests ran"; exit 1; }
          cp Cargo.lock ../ci-out/Cargo.lock
      - name: Front end
        run: |
          python tools/build_desktop.py --out build/desktop --fetch-fonts
      - name: Acceptance test (the page and the app's backend)
        if: always()
        run: |
          timeout 600 python tests/desktop_page.py --cli desktop/target/release/gamerepo-cli --ui build/desktop/ui \
            --home "$RUNNER_TEMP/pagehome" --out ci-out/page 2>&1 | tee ci-out/desktop-page.log
      - name: Build the app (AppImage, deb)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.3 build --bundles appimage,deb 2>&1 | tee ../ci-out/tauri-build.log
      - name: Collect bundles
        if: always()
        run: |
          mkdir -p dist
          find desktop/target/release/bundle -maxdepth 2 \( -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist/ \;
          ls -la dist | tee -a ci-out/bundles.txt
          # a bundle that wasn't made fails here, not later in the release (review M46)
          ls dist/*.AppImage dist/*.deb > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: bundles-linux, path: dist/, retention-days: 3 }
      - name: Start the app once (startup log)
        if: always()
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          (timeout 25 xvfb-run -a desktop/target/release/game-repo > ci-out/app-start.log 2>&1; echo "exit $?" >> ci-out/app-start.log) || true
          ls -la "$HOME/Game Repo" "$HOME/Game Repo/_library" >> ci-out/app-start.log 2>&1 || true
      - name: Drive the app (WebDriver)
        run: |
          cargo install tauri-driver --version 2.1.0 --locked 2>&1 | tail -3
          export HOME="$RUNNER_TEMP/home2" && mkdir -p "$HOME"
          # one X server for tauri-driver, WebKitWebDriver and the app it launches
          Xvfb :99 -screen 0 1600x1000x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 1
          tauri-driver > ci-out/tauri-driver.log 2>&1 &
          sleep 2
          timeout 600 python tests/desktop_ui.py --app desktop/target/release/game-repo --out ci-out/shots 2>&1 | tee ci-out/desktop-ui.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: library-linux
          path: |
            ci-out/page/library.zip
            ci-out/page/library-info.json
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: reports-linux, path: ci-out/, retention-days: 3, include-hidden-files: true }

  windows:
    name: Windows app
    needs: [version, tested]
    # (Already tested runs only for a push; a pull request's run and Run workflow build)
    if: ${{ !cancelled() && needs.version.result == 'success' && !needs.tested.outputs.run }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: desktop }
      # chdman, for the test that checks the CHDs written here (review M46): from MAME's
      # own Windows build, its SHA-256 checked, kept between runs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with: { path: ci-tools, key: chdman-mame0289-x64 }
      - name: chdman (MAME 0.289)
        run: |
          if [ ! -f ci-tools/chdman.exe ]; then
            mkdir -p ci-tools
            tmp=$(cygpath -u "$RUNNER_TEMP")
            curl -sSfL -o "$tmp/mame.exe" https://github.com/mamedev/mame/releases/download/mame0289/mame0289b_x64.exe
            echo "a1aa7912168c9d1b05e611906bc21b8b9be3935822aead36d12a1da363150b7d  $tmp/mame.exe" | sha256sum -c -
            7z e -y -oci-tools "$(cygpath -w "$tmp/mame.exe")" chdman.exe > /dev/null
            rm "$tmp/mame.exe"
          fi
          (ci-tools/chdman.exe || true) 2>&1 | head -1
          cygpath -w "$PWD/ci-tools" >> "$GITHUB_PATH"
      - name: Version ${{ needs.version.outputs.version }}
        run: python tools/set_version.py "${{ needs.version.outputs.version }}"
      - name: Check and test the Rust code
        working-directory: desktop
        env:
          GAMEREPO_TEST_CHDMAN: "1"   # chdman is installed: its test must run (review M46)
        run: |
          mkdir -p ../ci-out
          cargo build --release -p gamerepo-core 2>&1 | tee ../ci-out/core-build.log
          cargo test --release -p gamerepo-core 2>&1 | tee ../ci-out/core-test.log
          # the performance targets of docs/PLAN.md (100k-file rescan, 50k-ROM DAT), on generated data
          cargo test --release -p gamerepo-core -- --ignored timing --nocapture --test-threads=1 2>&1 | tee ../ci-out/core-timing.log
          # every timing test ran: a filter that matches none passes too (review M46)
          want=$(grep -rhoE "fn timing_[a-z0-9_]+" core/src | sort -u | wc -l)
          ran=$(grep -oE "test result: ok\. [0-9]+ passed" ../ci-out/core-timing.log | awk '{n += $4} END {print n + 0}')
          echo "timing tests: $ran of $want"
          [ "$ran" -eq "$want" ] || { echo "::error title=Timing tests::$ran of the $want timing tests ran"; exit 1; }
          cp Cargo.lock ../ci-out/Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: cli-windows, path: desktop/target/release/gamerepo-cli.exe, retention-days: 3 }
      - name: Front end
        env:
          # About shows the commit: a pull request's own, which main keeps when it's merged
          # (GITHUB_SHA is the pull request merged into main, a commit main never has)
          GAMEREPO_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/build_desktop.py --out build/desktop --fetch-fonts
      - name: Acceptance test (the page and the app's backend)
        env:
          PYTHONUTF8: "1"   # the console and open() default to cp1252 on Windows
        run: |
          pip install playwright==1.64.0
          python -m playwright install chromium 2>&1 | tail -2
          timeout 900 python tests/desktop_page.py --cli desktop/target/release/gamerepo-cli.exe --ui build/desktop/ui \
            --home "$RUNNER_TEMP/pagehome" --out ci-out/page 2>&1 | tee ci-out/desktop-page.log
      - name: Starter DATs from libretro (a real download; reported, not required)
        continue-on-error: true
        run: |
          desktop/target/release/gamerepo-cli.exe dat starter --home "$RUNNER_TEMP/starter" --library "$RUNNER_TEMP/starter/lib" 2>&1 | tee ci-out/starter-dats.log
          desktop/target/release/gamerepo-cli.exe dat list --home "$RUNNER_TEMP/starter" --library "$RUNNER_TEMP/starter/lib" 2>&1 | tee -a ci-out/starter-dats.log
      - name: Build the app (NSIS installer)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.3 build --bundles nsis 2>&1 | tee ../ci-out/tauri-build.log
      - name: Collect bundles
        if: always()
        run: |
          mkdir -p dist
          # a missing installer fails here, not later in the release (review M46)
          cp desktop/target/release/bundle/nsis/*.exe dist/
          ls -la dist | tee -a ci-out/bundles.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: bundles-windows, path: dist/, retention-days: 3 }
      - name: Drive the app (WebDriver)
        run: |
          pip install selenium==4.51.0
          cargo install tauri-driver --version 2.1.0 --locked 2>&1 | tail -3
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked 2>&1 | tail -3
          msedgedriver-tool 2>&1 | tail -3
          ls -la msedgedriver.exe
          tauri-driver --native-driver "$PWD/msedgedriver.exe" > ci-out/tauri-driver.log 2>&1 &
          sleep 3
          timeout 600 python tests/desktop_ui.py --app desktop/target/release/game-repo.exe \
            --out ci-out/shots 2>&1 | tee ci-out/desktop-ui.log
      - name: What passed
        # only reached when every step above passed: names these files and this version, so
        # a push to main with the same files publishes this installer (see Already tested)
        run: |
          mkdir -p tested
          git rev-parse 'HEAD^{tree}' > tested/TREE
          echo "${{ needs.version.outputs.version }}" > tested/VERSION
          echo "TESTED=tested-$(cat tested/TREE)-${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "${{ env.TESTED }}", path: tested/, retention-days: 3 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: reports-windows, path: ci-out/, retention-days: 3, include-hidden-files: true }

  reports:
    name: Reports
    needs: [linux, windows]
    # (a pull request from a fork has no token to push with)
    # (nothing to report when Windows' was already tested and Linux wasn't asked for)
    if: >-
      always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.windows.result != 'skipped' || needs.linux.result != 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # pushes the desktop-ci-<os> branches; runs nothing from the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: reports-*, path: reports }
      - name: Publish reports to desktop-ci-<os>
        env:
          GH_TOKEN: ${{ github.token }}
          # main's reports stay main's: a pull request's go to desktop-ci-<os>-pr (review M46)
          SUFFIX: ${{ github.event_name == 'pull_request' && '-pr' || '' }}
        run: |
          for os in linux windows; do
            [ -d "reports/reports-$os" ] || continue
            name=$([ "$os" = linux ] && echo Linux || echo Windows)
            (
              cd "reports/reports-$os"
              echo "${GITHUB_SHA}" > COMMIT
              git init -q && git checkout -q -b "desktop-ci-$os$SUFFIX"
              git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
              git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Desktop checks ($name) for ${GITHUB_SHA::7}"
              git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "desktop-ci-$os$SUFFIX"
            )
          done

  portability:
    name: Library made on Linux, opened on Windows
    needs: [linux, windows]
    if: always() && needs.linux.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: library-linux, path: lin }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: cli-windows, path: bin }
      - name: Open the Linux library on Windows and compare
        run: |
          mkdir -p "moved/My library" && cd "moved/My library" && unzip -q ../../lin/library.zip && cd ../..
          bin/gamerepo-cli.exe library-info --library "moved/My library" > win-info.json
          python - <<'PY'
          import json, sys
          lin = json.load(open("lin/library-info.json"))
          win = json.load(open("win-info.json"))
          win = {k: win[k] for k in lin}
          if lin == win:
              print(f"::notice title=Portable library::Same on Windows: {win['name']} (format {win['format']})")
              sys.exit(0)
          print(f"::error title=Portable library::differs: linux {json.dumps(lin)} windows {json.dumps(win)}")
          sys.exit(1)
          PY

  release:
    name: Release
    needs: [version, tested, linux, windows, portability]
    # only for a push to main (review M46: Run workflow on main published the same code
    # again), and only when every check that ran passed (Linux and the portability check
    # are skipped unless asked for), or Windows' was passed by a run with the same files
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.result == 'success' &&
      (needs.windows.result == 'success' || (needs.windows.result == 'skipped' && needs.tested.outputs.run != '')) &&
      contains(fromJSON('["success","skipped"]'), needs.linux.result) &&
      contains(fromJSON('["success","skipped"]'), needs.portability.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # creates the release and its tag
      actions: read     # the installer of the run that tested these files (Already tested)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false, fetch-depth: 0 }   # tags and history, for "what changed"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.tested.outputs.run == ''
        with: { pattern: bundles-*, path: dist, merge-multiple: true }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.tested.outputs.run != ''
        with: { name: bundles-windows, path: dist, run-id: "${{ needs.tested.outputs.run }}", github-token: "${{ github.token }}" }
      - name: Publish v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          ls dist/*_"${V}"_x64-setup.exe > /dev/null   # the installer is this version's
          prev=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          {
            echo "**Windows:** the \`-setup.exe\` (unsigned, so SmartScreen asks once: More info → Run anyway)."
            if ls dist/*.deb dist/*.AppImage > /dev/null 2>&1; then
              echo "**Linux:** the \`.deb\` or the \`.AppImage\`."
            fi
            echo
            # what changed for the user: CHANGELOG.md's Unreleased section; the
            # commit subjects only when that section is empty
            awk '/^## Unreleased/{on=1; next} on && /^## /{exit} on' CHANGELOG.md | sed '/./,$!d' > unreleased.md
            if [ -s unreleased.md ]; then
              echo "### What's new"
              echo
              cat unreleased.md
            elif [ -n "$prev" ]; then
              echo "### Changes since $prev"
              git log --no-merges --format='- %s' "$prev..$GITHUB_SHA"
            else
              echo "First release."
            fi
          } > notes.md
          gh release create "v$V" dist/* --title "Game Repo $V" --notes-file notes.md --target "$GITHUB_SHA" --latest
          echo "::notice title=Released::Game Repo $V"
      - name: The version's heading in CHANGELOG.md
        # what was just published under Unreleased gets its version's heading on main, so the
        # next release's notes start empty (review M46); a push with this token starts no run
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          [ -s unreleased.md ] || { echo "Nothing was under Unreleased."; exit 0; }
          git fetch -q origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- CHANGELOG.md; then
            echo "::warning title=Changelog::CHANGELOG.md changed on main after this build: the next pull request gives Unreleased its heading"
            exit 0
          fi
          git checkout -q -B main FETCH_HEAD
          awk -v h="## $V ($(date -u +%Y-%m-%d))" '!done && /^## Unreleased[[:space:]]*$/ { print; print ""; print h; done = 1; next } { print }' CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qam "CHANGELOG.md: $V is published"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main \
            || echo "::warning title=Changelog::couldn't push the heading: the next pull request gives Unreleased its heading"
