name: Desktop

# Builds the desktop app (Tauri) for Windows with Game Repo Server beside it and on its
# own, and Game Repo Go (the device client) on its own, as an Android APK and as an
# AppImage for the Steam Deck; runs the Rust tests and the acceptance test (the page against
# the app's real backend), Game Repo Server (as the CLI and as its tray app) against the
# stand-in device client, Game Repo Go's pages against its backend and the server, drives
# the app and Game Repo Go through WebDriver (on Linux with a virtual controller too), Game
# Repo Go's APK on an Android emulator and its Steam helper against a stand-in Steam, signs
# the APK with the key in the repository's secrets (tools/android_signing_key.cmd puts it
# there; without it the APK isn't published), and when everything passes on main publishes
# a numbered release (v0.0.0, v0.0.1, ...; see tools/set_version.py) with notes taken from
# CHANGELOG.md's Unreleased section. Game Repo itself is for Windows only (decision D3,
# docs/PLAN.md): its Linux app and the Linux-to-Windows library check run only when asked
# for, from Run workflow with "Linux too" ticked. Reports and screenshots go to the
# desktop-ci-<os> branches (a pull request's to desktop-ci-<os>-pr). The token is
# read-only except in the two jobs that write (reports and release), which run no build
# or test code; actions are pinned to commits and tools to exact versions. Only a push
# to main publishes: Run workflow on main builds and tests but doesn't publish again.
# A push whose files a pull request's run already built and tested on Windows, Android and
# the Steam Deck, for the same version, publishes that run's installers, APK and AppImage
# instead of building and testing again
# (the "Already tested" job); any difference, such as another merge in between, runs
# everything.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "web/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/desktop.yml"
  # a pull request that changes only the plan, other docs or CHANGELOG.md builds nothing,
  # as such a push to main publishes nothing
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "web/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      linux:
        description: "Linux too (the Linux app and the Linux-to-Windows library check)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  version:
    name: Release number
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - id: version
        run: |
          v=$(python3 tools/set_version.py --next)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::$v"

  tested:
    name: Already tested
    needs: version
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # lists other runs' artifacts
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          # the What passed job names what Windows, Android and the Steam Deck passed with: these files (their
          # git tree) and this version. Only a run from this repository's own branches counts (a
          # fork's pull request could name any files), and only while its installer is kept;
          # once the signing key is in the secrets, only a run that signed the APK with it (one
          # tested before the key was added would publish no APK)
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
          name="tested-$tree-$V"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name" \
            --jq '.artifacts[] | select(.expired | not) | .workflow_run | select(.head_repository_id == ${{ github.repository_id }}) | .id')
          for run in $runs; do
            [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .path)" = .github/workflows/desktop.yml ] || continue
            kept=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select(.name == "bundles-windows" and (.expired | not))] | length')
            [ "$kept" = 1 ] || continue
            appimage=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select(.name == "bundles-deck" and (.expired | not))] | length')
            [ "$appimage" = 1 ] || { echo "run $run has no AppImage: not using it"; continue; }
            if [ "$SIGNING_KEY" = true ]; then
              apk=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
                --jq '[.artifacts[] | select(.name == "bundles-android" and (.expired | not))] | length')
              [ "$apk" = 1 ] || { echo "run $run has no signed APK: not using it"; continue; }
            fi
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already tested::run $run built and tested these files as $V: publishing its installer"
            exit 0
          done
          echo "::notice title=Not tested yet::no run built and tested these files as $V: building and testing"

  linux:
    name: Linux app
    needs: version
    if: github.event_name == 'workflow_dispatch' && inputs.linux
    runs-on: ubuntu-22.04   # oldest supported: the AppImage then runs on newer systems too
    timeout-minutes: 60
    defaults:
      run: { shell: bash }   # -o pipefail, so "cmd | tee log" fails when cmd fails
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: System packages
        run: |
          sudo apt-get update -q
          # mame-tools: chdman, for the test that checks the CHDs written here (review M46)
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xvfb webkit2gtk-driver mame-tools
          pip install selenium==4.51.0 playwright==1.64.0
          python -m playwright install --with-deps chromium 2>&1 | tail -2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: desktop }
      - name: Version ${{ needs.version.outputs.version }}
        run: python tools/set_version.py "${{ needs.version.outputs.version }}"
      - name: Check and test the Rust code
        working-directory: desktop
        env:
          GAMEREPO_TEST_CHDMAN: "1"   # chdman is installed: its test must run (review M46)
        run: |
          mkdir -p ../ci-out
          cargo build --release -p gamerepo-cli 2>&1 | tee ../ci-out/core-build.log
          cargo test --release -p gamerepo-core -p gamerepo-wire -p gamerepo-serve -p gamerepo-device 2>&1 | tee ../ci-out/core-test.log
          # the performance targets of docs/PLAN.md (100k-file rescan, 50k-ROM DAT, a catalogue
          # of 100k games, a download on this computer), on generated data
          cargo test --release -p gamerepo-core -p gamerepo-serve -- --ignored timing --nocapture --test-threads=1 2>&1 | tee ../ci-out/core-timing.log
          # every timing test ran: a filter that matches none passes too (review M46)
          want=$(grep -rhoE "fn timing_[a-z0-9_]+" core/src serve | sort -u | wc -l)
          ran=$(grep -oE "test result: ok\. [0-9]+ passed" ../ci-out/core-timing.log | awk '{n += $4} END {print n + 0}')
          echo "timing tests: $ran of $want"
          [ "$ran" -eq "$want" ] || { echo "::error title=Timing tests::$ran of the $want timing tests ran"; exit 1; }
          cp Cargo.lock ../ci-out/Cargo.lock
      - name: Front end
        run: |
          python tools/build_desktop.py --out build/desktop --fetch-fonts
      - name: Acceptance test (the page and the app's backend)
        if: always()
        run: |
          timeout 600 python tests/desktop_page.py --cli desktop/target/release/gamerepo-cli --ui build/desktop/ui \
            --home "$RUNNER_TEMP/pagehome" --out ci-out/page 2>&1 | tee ci-out/desktop-page.log
      - name: Game Repo Server and a stand-in device
        if: always()
        run: |
          timeout 300 python tests/serve_devices.py --cli desktop/target/release/gamerepo-cli \
            --home "$RUNNER_TEMP/serve-devices" --out ci-out/serve-devices 2>&1 | tee ci-out/serve-devices.log
      - name: Game Repo Go's pages, its backend and Game Repo Server
        if: always()
        run: |
          timeout 600 python tests/client_page.py --cli desktop/target/release/gamerepo-cli --ui build/desktop/ui \
            --home "$RUNNER_TEMP/go-page" --out ci-out/go-page 2>&1 | tee ci-out/go-page.log
      - name: Build the app (AppImage, deb)
        # (Game Repo Server goes beside the app on Windows only: D3)
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.3 build --bundles appimage,deb 2>&1 | tee ../../ci-out/tauri-build.log
      - name: Collect bundles
        if: always()
        run: |
          mkdir -p dist
          find desktop/target/release/bundle -maxdepth 2 \( -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist/ \;
          ls -la dist | tee -a ci-out/bundles.txt
          # a bundle that wasn't made fails here, not later in the release (review M46)
          ls dist/*.AppImage dist/*.deb > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: bundles-linux, path: dist/, retention-days: 3 }
      - name: Start the app once (startup log)
        if: always()
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          (timeout 25 xvfb-run -a desktop/target/release/game-repo > ci-out/app-start.log 2>&1; echo "exit $?" >> ci-out/app-start.log) || true
          ls -la "$HOME/Game Repo" "$HOME/Game Repo/_library" >> ci-out/app-start.log 2>&1 || true
      - name: Drive the app (WebDriver)
        run: |
          cargo install tauri-driver --version 2.1.0 --locked 2>&1 | tail -3
          export HOME="$RUNNER_TEMP/home2" && mkdir -p "$HOME"
          # one X server for tauri-driver, WebKitWebDriver and the app it launches
          Xvfb :99 -screen 0 1600x1000x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 1
          tauri-driver > ci-out/tauri-driver.log 2>&1 &
          sleep 2
          timeout 600 python tests/desktop_ui.py --app desktop/target/release/game-repo --out ci-out/shots 2>&1 | tee ci-out/desktop-ui.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: library-linux
          path: |
            ci-out/page/library.zip
            ci-out/page/library-info.json
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: reports-linux, path: ci-out/, retention-days: 3, include-hidden-files: true }

  windows:
    name: Windows app
    needs: [version, tested]
    # (Already tested runs only for a push; a pull request's run and Run workflow build)
    if: ${{ !cancelled() && needs.version.result == 'success' && !needs.tested.outputs.run }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: desktop }
      # chdman, for the test that checks the CHDs written here (review M46): from MAME's
      # own Windows build, its SHA-256 checked, kept between runs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with: { path: ci-tools, key: chdman-mame0289-x64 }
      - name: chdman (MAME 0.289)
        run: |
          if [ ! -f ci-tools/chdman.exe ]; then
            mkdir -p ci-tools
            tmp=$(cygpath -u "$RUNNER_TEMP")
            curl -sSfL -o "$tmp/mame.exe" https://github.com/mamedev/mame/releases/download/mame0289/mame0289b_x64.exe
            echo "a1aa7912168c9d1b05e611906bc21b8b9be3935822aead36d12a1da363150b7d  $tmp/mame.exe" | sha256sum -c -
            7z e -y -oci-tools "$(cygpath -w "$tmp/mame.exe")" chdman.exe > /dev/null
            rm "$tmp/mame.exe"
          fi
          (ci-tools/chdman.exe || true) 2>&1 | head -1
          cygpath -w "$PWD/ci-tools" >> "$GITHUB_PATH"
      - name: Version ${{ needs.version.outputs.version }}
        run: python tools/set_version.py "${{ needs.version.outputs.version }}"
      - name: The Android signing key helper, as Jerred runs it (both of its ways)
        run: |
          mkdir -p ci-out
          python tests/android_key.py --out "$RUNNER_TEMP/android-key" 2>&1 | tee ci-out/android-key.log
      - name: Check and test the Rust code
        working-directory: desktop
        env:
          GAMEREPO_TEST_CHDMAN: "1"   # chdman is installed: its test must run (review M46)
        run: |
          mkdir -p ../ci-out
          cargo build --release -p gamerepo-cli 2>&1 | tee ../ci-out/core-build.log
          cargo test --release -p gamerepo-core -p gamerepo-wire -p gamerepo-serve -p gamerepo-device 2>&1 | tee ../ci-out/core-test.log
          # the performance targets of docs/PLAN.md (100k-file rescan, 50k-ROM DAT, a catalogue
          # of 100k games, a download on this computer), on generated data
          cargo test --release -p gamerepo-core -p gamerepo-serve -- --ignored timing --nocapture --test-threads=1 2>&1 | tee ../ci-out/core-timing.log
          # every timing test ran: a filter that matches none passes too (review M46)
          want=$(grep -rhoE "fn timing_[a-z0-9_]+" core/src serve | sort -u | wc -l)
          ran=$(grep -oE "test result: ok\. [0-9]+ passed" ../ci-out/core-timing.log | awk '{n += $4} END {print n + 0}')
          echo "timing tests: $ran of $want"
          [ "$ran" -eq "$want" ] || { echo "::error title=Timing tests::$ran of the $want timing tests ran"; exit 1; }
          cp Cargo.lock ../ci-out/Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: cli-windows, path: desktop/target/release/gamerepo-cli.exe, retention-days: 3 }
      - name: Front end
        env:
          # About shows the commit: a pull request's own, which main keeps when it's merged
          # (GITHUB_SHA is the pull request merged into main, a commit main never has)
          GAMEREPO_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/build_desktop.py --out build/desktop --fetch-fonts
      - name: Acceptance test (the page and the app's backend)
        env:
          PYTHONUTF8: "1"   # the console and open() default to cp1252 on Windows
        run: |
          pip install playwright==1.64.0
          python -m playwright install chromium 2>&1 | tail -2
          timeout 900 python tests/desktop_page.py --cli desktop/target/release/gamerepo-cli.exe --ui build/desktop/ui \
            --home "$RUNNER_TEMP/pagehome" --out ci-out/page 2>&1 | tee ci-out/desktop-page.log
      - name: Game Repo Server and a stand-in device
        env:
          PYTHONUTF8: "1"
        run: |
          timeout 300 python tests/serve_devices.py --cli desktop/target/release/gamerepo-cli.exe \
            --home "$RUNNER_TEMP/serve-devices" --out ci-out/serve-devices 2>&1 | tee ci-out/serve-devices.log
      - name: Game Repo Go's pages, its backend and Game Repo Server
        env:
          PYTHONUTF8: "1"
        run: |
          timeout 600 python tests/client_page.py --cli desktop/target/release/gamerepo-cli.exe --ui build/desktop/ui \
            --home "$RUNNER_TEMP/go-page" --out ci-out/go-page 2>&1 | tee ci-out/go-page.log
      - name: Starter DATs from libretro (a real download; reported, not required)
        continue-on-error: true
        run: |
          desktop/target/release/gamerepo-cli.exe dat starter --home "$RUNNER_TEMP/starter" --library "$RUNNER_TEMP/starter/lib" 2>&1 | tee ci-out/starter-dats.log
          desktop/target/release/gamerepo-cli.exe dat list --home "$RUNNER_TEMP/starter" --library "$RUNNER_TEMP/starter/lib" 2>&1 | tee -a ci-out/starter-dats.log
      - name: Build Game Repo Server (its own installer, and the program beside Game Repo)
        working-directory: desktop/server
        run: |
          npx --yes @tauri-apps/cli@2.12.3 build --bundles nsis 2>&1 | tee ../../ci-out/tauri-build-server.log
          # Game Repo's installer puts it beside the app (src-tauri/tauri.windows.conf.json)
          mkdir -p ../src-tauri/binaries
          cp ../target/release/gamerepo-server.exe ../src-tauri/binaries/gamerepo-server-x86_64-pc-windows-msvc.exe
      - name: Game Repo Server (its tray app) and a stand-in device
        env:
          PYTHONUTF8: "1"
        run: |
          timeout 300 python tests/serve_devices.py --cli desktop/target/release/gamerepo-cli.exe --server desktop/target/release/gamerepo-server.exe \
            --home "$RUNNER_TEMP/serve-devices-app" --out ci-out/serve-devices-app 2>&1 | tee ci-out/serve-devices-app.log
      - name: Build Game Repo Go (its own installer)
        working-directory: desktop/client
        run: |
          npx --yes @tauri-apps/cli@2.12.3 build --bundles nsis 2>&1 | tee ../../ci-out/tauri-build-client.log
          cargo test --release -p gamerepo-client 2>&1 | tee ../../ci-out/client-test.log
      - name: Build the app (NSIS installer, with Game Repo Server beside it)
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.3 build --bundles nsis 2>&1 | tee ../../ci-out/tauri-build.log
      - name: Collect bundles
        if: always()
        run: |
          mkdir -p dist
          # a missing installer fails here, not later in the release (review M46)
          cp desktop/target/release/bundle/nsis/*.exe dist/
          ls -la dist | tee -a ci-out/bundles.txt
          ls dist/"Game Repo_"*_x64-setup.exe dist/"Game Repo Server_"*_x64-setup.exe dist/"Game Repo Go_"*_x64-setup.exe > /dev/null
          # Game Repo's installer carries the server, installed beside the app
          if 7z l dist/"Game Repo_"*_x64-setup.exe > ci-out/installer-files.txt 2>&1 && grep -q "game-repo.exe" ci-out/installer-files.txt; then
            grep -q "gamerepo-server.exe" ci-out/installer-files.txt || { echo "::error title=Installer::Game Repo's installer doesn't carry Game Repo Server"; exit 1; }
          else
            echo "::warning title=Installer::7-Zip couldn't list Game Repo's installer, so what it carries wasn't checked"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: bundles-windows, path: dist/, retention-days: 3 }
      - name: Drive the app (WebDriver)
        run: |
          pip install selenium==4.51.0
          cargo install tauri-driver --version 2.1.0 --locked 2>&1 | tail -3
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked 2>&1 | tail -3
          msedgedriver-tool 2>&1 | tail -3
          ls -la msedgedriver.exe
          tauri-driver --native-driver "$PWD/msedgedriver.exe" > ci-out/tauri-driver.log 2>&1 &
          sleep 3
          timeout 600 python tests/desktop_ui.py --app desktop/target/release/game-repo.exe \
            --out ci-out/shots 2>&1 | tee ci-out/desktop-ui.log
          # Game Repo Go: paired with a server, a picture, a download, Credential Manager
          PYTHONUTF8=1 timeout 600 python tests/client_ui.py --app desktop/target/release/gamerepo-client.exe \
            --cli desktop/target/release/gamerepo-cli.exe --home "$RUNNER_TEMP/go-ui" --out ci-out/go-shots 2>&1 | tee ci-out/client-ui.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: reports-windows, path: ci-out/, retention-days: 3, include-hidden-files: true }

  android:
    name: Android app
    needs: [version, tested]
    if: ${{ !cancelled() && needs.version.result == 'success' && !needs.tested.outputs.run }}
    runs-on: ubuntu-24.04   # its Android SDK, NDK and Java 17; KVM for the emulator
    timeout-minutes: 75
    defaults:
      run: { shell: bash }
    env:
      SYSTEM_IMAGE: "system-images;android-34;google_apis;x86_64"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "aarch64-linux-android,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: desktop }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-tauri2.12.3-${{ hashFiles('desktop/client/plugin/android/build.gradle.kts') }}
      - name: Room on the disk (three Rust targets, Gradle and the emulator)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Start an Android emulator (it boots while the app builds)
        run: |
          mkdir -p ci-out
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          (yes || true) | "$sdk/sdkmanager" --licenses > /dev/null
          "$sdk/sdkmanager" emulator platform-tools "$SYSTEM_IMAGE" > ci-out/sdkmanager.log
          device=$("$sdk/avdmanager" list device -c | grep -m1 -xE 'pixel_(7|6|5)' || echo pixel)
          # where avdmanager writes the emulator and the emulator reads it, said once for both
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdk/avdmanager" create avd -n go -k "$SYSTEM_IMAGE" -d "$device" --force > ci-out/avdmanager.log 2>&1
          [ -f "$ANDROID_AVD_HOME/go.ini" ] || { cat ci-out/avdmanager.log; echo "::error title=Emulator::avdmanager didn't make the emulator"; exit 1; }
          nohup "$ANDROID_HOME/emulator/emulator" -avd go -no-window -no-audio -no-boot-anim -no-snapshot -memory 3072 \
            -gpu swiftshader_indirect -camera-back none -camera-front none > ci-out/emulator.log 2>&1 &
      - name: Version ${{ needs.version.outputs.version }}
        run: python tools/set_version.py "${{ needs.version.outputs.version }}"
      - name: Front end
        env:
          GAMEREPO_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/build_desktop.py --out build/desktop --fetch-fonts
      - name: Game Repo's command line (it serves the library to the emulator)
        working-directory: desktop
        run: cargo build -p gamerepo-cli 2>&1 | tee ../ci-out/cli-build.log
      - name: Build Game Repo Go for Android (arm64 for devices; x86_64 with debugging for the emulator)
        working-directory: desktop/client
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64" NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # Tauri's Gradle build calls its command line back the way it was started, and for
          # npm that's "npm run tauri" in this folder: so a package.json with that script
          # here, made for this job only
          echo '{ "private": true, "scripts": { "tauri": "tauri" } }' > package.json
          npm install --no-save --no-audit --no-fund @tauri-apps/cli@2.12.3 2>&1 | tail -2
          tauri() { npm run tauri -- "$@"; }
          tauri android init --ci 2>&1 | tee ../../ci-out/android-init.log
          # the launcher icon (written into gen/android's res folders)
          tauri icon ../src-tauri/icons/icon.png 2>&1 | tail -3
          tauri android build --ci --apk --split-per-abi --target aarch64 2>&1 | tee ../../ci-out/android-build.log
          # the emulator's: a debug build, so its web view can be driven (no debug info, smaller)
          CARGO_PROFILE_DEV_DEBUG=false tauri android build --ci --apk --split-per-abi --target x86_64 --debug 2>&1 | tee ../../ci-out/android-build-debug.log
          find gen/android/app/build/outputs/apk -name '*.apk' -exec ls -la {} \; | tee ../../ci-out/apks.txt
      - name: Game Repo Go on the emulator, against Game Repo Server
        run: |
          pgrep -f qemu-system > /dev/null || { cat ci-out/emulator.log; echo "::error title=Emulator::the emulator isn't running"; exit 1; }
          timeout 600 adb wait-for-device
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 3; done'
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do adb shell settings put global $s 0; done
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard || true
          adb shell getprop ro.product.cpu.abilist | tee ci-out/emulator-abis.txt
          pip install websocket-client==1.8.0
          apk=$(find desktop/client/gen/android/app/build/outputs/apk -path '*x86_64*' -name '*debug.apk' | head -1)
          timeout 900 python tests/client_android.py --apk "$apk" --cli desktop/target/debug/gamerepo-cli \
            --home "$RUNNER_TEMP/go-android" --out ci-out/go-android 2>&1 | tee ci-out/client-android.log
      - name: Sign the APK (with the key from tools/android_signing_key.cmd)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          V: ${{ needs.version.outputs.version }}
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unsigned=$(find desktop/client/gen/android/app/build/outputs/apk -path '*arm64*' -name '*release*.apk' | head -1)
          mkdir -p dist
          "$bt/zipalign" -f -P 16 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          if [ -n "$KEYSTORE" ] && [ -n "$KEYPASS" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/go.p12"
            published="dist/Game Repo Go_${V}_arm64.apk"
          else
            # no key yet: signed with a throwaway one for the check below, and not published
            echo "::warning title=Android::The signing key isn't in the repository's secrets yet (run tools/android_signing_key.cmd), so the APK is built and checked but not published"
            KEYPASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/go.p12" -storetype PKCS12 -storepass:env KEYPASS -alias check \
              -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Game Repo Go check" > /dev/null
            published=""
          fi
          # the key's name in the file is whatever Windows gave it: the file's only key
          alias=$(keytool -list -v -keystore "$RUNNER_TEMP/go.p12" -storetype PKCS12 -storepass:env KEYPASS | sed -n 's/^Alias name: //p' | head -1)
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/go.p12" --ks-type PKCS12 --ks-pass env:KEYPASS --ks-key-alias "$alias" \
            --out "$RUNNER_TEMP/game-repo-go.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/go.p12"
          "$bt/apksigner" verify --print-certs "$RUNNER_TEMP/game-repo-go.apk" | tee ci-out/apk-certificate.txt
          [ -z "$published" ] || cp "$RUNNER_TEMP/game-repo-go.apk" "$published"
          ls -la dist | tee ci-out/bundles.txt
      - name: The signed APK starts (arm64, where the emulator can run it)
        run: |
          if grep -q arm64-v8a ci-out/emulator-abis.txt; then
            timeout 300 python tests/client_android.py --smoke --apk "$RUNNER_TEMP/game-repo-go.apk" --out ci-out/go-android 2>&1 | tee ci-out/client-android-release.log
          else
            echo "::warning title=Android::This emulator can't run arm64 apps, so the signed APK wasn't started"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: bundles-android, path: dist/, retention-days: 3, if-no-files-found: ignore }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: reports-android, path: ci-out/, retention-days: 3, include-hidden-files: true }

  deck:
    name: Steam Deck app
    needs: [version, tested]
    if: ${{ !cancelled() && needs.version.result == 'success' && !needs.tested.outputs.run }}
    runs-on: ubuntu-22.04   # oldest supported: the AppImage then runs on SteamOS and newer systems too
    timeout-minutes: 60
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xvfb webkit2gtk-driver xdotool
          pip install selenium==4.51.0 playwright==1.64.0 evdev==1.7.1
          python -m playwright install --with-deps chromium 2>&1 | tail -2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: desktop }
      - name: Version ${{ needs.version.outputs.version }}
        run: python tools/set_version.py "${{ needs.version.outputs.version }}"
      - name: Room for a virtual controller (uinput), as Steam Input gives the app one on the Deck
        run: |
          sudo modprobe uinput
          # the controller's input device readable by its user, as on the Deck (WebKitGTK reads it)
          echo 'KERNEL=="uinput", MODE="0666"' | sudo tee /etc/udev/rules.d/99-gamerepo-pad.rules > /dev/null
          echo 'SUBSYSTEM=="input", KERNEL=="event*", MODE="0666"' | sudo tee -a /etc/udev/rules.d/99-gamerepo-pad.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --subsystem-match=misc --subsystem-match=input
          sudo chmod 0666 /dev/uinput
          ls -la /dev/uinput
      - name: Check and test the Rust code (Steam's files, the Steam helper, Game Repo Go's backend)
        working-directory: desktop
        run: |
          mkdir -p ../ci-out
          cargo build --release -p gamerepo-cli 2>&1 | tee ../ci-out/cli-build.log
          cargo test --release -p gamerepo-steam -p gamerepo-device 2>&1 | tee ../ci-out/deck-test.log
          # Game Repo's own Steam export, which shares the Steam crate
          cargo test --release -p gamerepo-core steam 2>&1 | tee ../ci-out/core-steam-test.log
      - name: Front end
        env:
          GAMEREPO_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/build_desktop.py --out build/desktop --fetch-fonts
      - name: Game Repo Go's pages (as on Linux and in Game Mode), its backend and Game Repo Server
        run: |
          timeout 600 python tests/client_page.py --cli desktop/target/release/gamerepo-cli --ui build/desktop/ui \
            --home "$RUNNER_TEMP/go-page" --out ci-out/go-page 2>&1 | tee ci-out/go-page.log
      - name: Build Game Repo Go (AppImage)
        working-directory: desktop/client
        run: |
          npx --yes @tauri-apps/cli@2.12.3 build --bundles appimage 2>&1 | tee ../../ci-out/tauri-build-client.log
          # (its tests need the front end built, as the app does)
          cargo test --release -p gamerepo-client 2>&1 | tee ../../ci-out/client-test.log
      - name: Collect the AppImage
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          cp desktop/target/release/bundle/appimage/*.AppImage dist/
          ls -la dist | tee ci-out/bundles.txt
          # a missing AppImage fails here, not later in the release (review M46)
          ls dist/"Game Repo Go_${V}_amd64.AppImage" > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: bundles-deck, path: dist/, retention-days: 3 }
      - name: The AppImage starts, and its Steam helper restarts a stand-in Steam
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          app="$PWD/dist/Game Repo Go_${V}_amd64.AppImage"
          chmod +x "$app"
          (HOME="$RUNNER_TEMP/deck-start" && mkdir -p "$HOME" && export HOME && timeout 25 xvfb-run -a "$app" > ci-out/appimage-start.log 2>&1; echo "exit $?" >> ci-out/appimage-start.log) || true
          tail -5 ci-out/appimage-start.log
          # still running when it was stopped after 25 s (timeout's 124): it started
          grep -qx "exit 124" ci-out/appimage-start.log || { echo "::error title=AppImage::Game Repo Go's AppImage didn't keep running (appimage-start.log)"; exit 1; }
          timeout 300 python tests/steam_helper.py --program "$app" --out ci-out/steam-helper 2>&1 | tee ci-out/steam-helper.log
      - name: Drive Game Repo Go (WebDriver), with a virtual controller
        run: |
          cargo install tauri-driver --version 2.1.0 --locked 2>&1 | tail -3
          export HOME="$RUNNER_TEMP/deck-ui" && mkdir -p "$HOME"
          # one X server for tauri-driver, WebKitWebDriver and the app it launches
          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 1
          tauri-driver > ci-out/tauri-driver.log 2>&1 &
          sleep 2
          timeout 600 python tests/client_ui.py --gamepad --app desktop/target/release/gamerepo-client \
            --cli desktop/target/release/gamerepo-cli --home "$RUNNER_TEMP/go-ui" --out ci-out/go-shots 2>&1 | tee ci-out/client-ui.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: reports-deck, path: ci-out/, retention-days: 3, include-hidden-files: true }

  passed:
    name: What passed
    needs: [version, windows, android, deck]
    # only when Windows, Android and the Steam Deck passed: names these files and this version,
    # so a push to main with the same files publishes this run's installers, APK and AppImage
    # (see Already tested)
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.android.result == 'success' && needs.deck.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: |
          mkdir -p tested
          git rev-parse 'HEAD^{tree}' > tested/TREE
          echo "${{ needs.version.outputs.version }}" > tested/VERSION
          echo "TESTED=tested-$(cat tested/TREE)-${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "${{ env.TESTED }}", path: tested/, retention-days: 3 }

  reports:
    name: Reports
    needs: [linux, windows, android, deck]
    # (a pull request from a fork has no token to push with)
    # (nothing to report when Windows', Android's and the Deck's were already tested and Linux wasn't asked for)
    if: >-
      always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.windows.result != 'skipped' || needs.android.result != 'skipped' || needs.deck.result != 'skipped' || needs.linux.result != 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # pushes the desktop-ci-<os> branches; runs nothing from the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: reports-*, path: reports }
      - name: Publish reports to desktop-ci-<os>
        env:
          GH_TOKEN: ${{ github.token }}
          # main's reports stay main's: a pull request's go to desktop-ci-<os>-pr (review M46)
          SUFFIX: ${{ github.event_name == 'pull_request' && '-pr' || '' }}
        run: |
          for os in linux windows android deck; do
            [ -d "reports/reports-$os" ] || continue
            name=$(case $os in linux) echo Linux;; windows) echo Windows;; deck) echo Steam Deck;; *) echo Android;; esac)
            (
              cd "reports/reports-$os"
              echo "${GITHUB_SHA}" > COMMIT
              git init -q && git checkout -q -b "desktop-ci-$os$SUFFIX"
              git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
              git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Desktop checks ($name) for ${GITHUB_SHA::7}"
              git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "desktop-ci-$os$SUFFIX"
            )
          done

  portability:
    name: Library made on Linux, opened on Windows
    needs: [linux, windows]
    if: always() && needs.linux.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: library-linux, path: lin }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: cli-windows, path: bin }
      - name: Open the Linux library on Windows and compare
        run: |
          mkdir -p "moved/My library" && cd "moved/My library" && unzip -q ../../lin/library.zip && cd ../..
          bin/gamerepo-cli.exe library-info --library "moved/My library" > win-info.json
          python - <<'PY'
          import json, sys
          lin = json.load(open("lin/library-info.json"))
          win = json.load(open("win-info.json"))
          win = {k: win[k] for k in lin}
          if lin == win:
              print(f"::notice title=Portable library::Same on Windows: {win['name']} (format {win['format']})")
              sys.exit(0)
          print(f"::error title=Portable library::differs: linux {json.dumps(lin)} windows {json.dumps(win)}")
          sys.exit(1)
          PY

  release:
    name: Release
    needs: [version, tested, linux, windows, android, deck, passed, portability]
    # only for a push to main (review M46: Run workflow on main published the same code
    # again), and only when every check that ran passed (Linux and the portability check
    # are skipped unless asked for), or Windows', Android's and the Deck's were passed by a run
    # with the same files
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.result == 'success' &&
      (needs.passed.result == 'success' || (needs.windows.result == 'skipped' && needs.android.result == 'skipped' && needs.deck.result == 'skipped' && needs.tested.outputs.run != '')) &&
      contains(fromJSON('["success","skipped"]'), needs.linux.result) &&
      contains(fromJSON('["success","skipped"]'), needs.portability.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # creates the release and its tag
      actions: read     # the installer of the run that tested these files (Already tested)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false, fetch-depth: 0 }   # tags and history, for "what changed"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.tested.outputs.run == ''
        with: { pattern: bundles-*, path: dist, merge-multiple: true }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.tested.outputs.run != ''
        with: { pattern: bundles-*, path: dist, merge-multiple: true, run-id: "${{ needs.tested.outputs.run }}", github-token: "${{ github.token }}" }
      - name: Publish v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          ls dist/"Game Repo_${V}_x64-setup.exe" dist/"Game Repo Server_${V}_x64-setup.exe" dist/"Game Repo Go_${V}_x64-setup.exe" dist/"Game Repo Go_${V}_amd64.AppImage" > /dev/null   # the installers are this version's
          prev=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          {
            echo "**Windows:** \`Game Repo_${V}_x64-setup.exe\` (unsigned, so SmartScreen asks once: More info → Run anyway). It installs Game Repo Server beside the app."
            echo "\`Game Repo Server_${V}_x64-setup.exe\` is Game Repo Server on its own, for a computer that serves a library to devices without Game Repo."
            echo "\`Game Repo Go_${V}_x64-setup.exe\` is Game Repo Go, for a Windows computer or handheld that downloads games from a library into ES-DE."
            apk="dist/Game Repo Go_${V}_arm64.apk"
            if [ -f "$apk" ]; then
              cert=$("$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}')   # "Signer #1 certificate …" or "V3.0 Signer: certificate …"
              [ -n "$cert" ] || { echo "::error title=Android::apksigner printed no certificate for the APK" >&2; exit 1; }
              echo
              echo "**Android:** \`Game Repo Go_${V}_arm64.apk\` is Game Repo Go for an Android phone or handheld (Android 10 or later) with ES-DE. The first time, Android asks you to allow installing apps from your browser or file manager. Every version is signed with the same certificate (SHA-256 \`${cert}\`), so a new one installs over the last."
            else
              echo "::warning title=Android::No APK to publish (the signing key isn't in the repository's secrets yet)" >&2
            fi
            echo
            echo "**Steam Deck and Linux:** \`Game Repo Go_${V}_amd64.AppImage\` is Game Repo Go for a Steam Deck, or a Linux computer with ES-DE. On the Deck, in Desktop Mode: download it, right-click it › Properties › Permissions › tick Is executable, and open it. In its Settings › Steam, tick \"Game Repo Go in Steam's library\", and it's in Game Mode's library too, where the Deck's controls work it."
            if ls dist/*.deb "dist/Game Repo_${V}_amd64.AppImage" > /dev/null 2>&1; then
              echo "**Linux:** Game Repo itself, the \`.deb\` or \`Game Repo_${V}_amd64.AppImage\`."
            fi
            echo
            # what changed for the user: CHANGELOG.md's Unreleased section; the
            # commit subjects only when that section is empty
            awk '/^## Unreleased/{on=1; next} on && /^## /{exit} on' CHANGELOG.md | sed '/./,$!d' > unreleased.md
            if [ -s unreleased.md ]; then
              echo "### What's new"
              echo
              cat unreleased.md
            elif [ -n "$prev" ]; then
              echo "### Changes since $prev"
              git log --no-merges --format='- %s' "$prev..$GITHUB_SHA"
            else
              echo "First release."
            fi
          } > notes.md
          gh release create "v$V" dist/* --title "Game Repo $V" --notes-file notes.md --target "$GITHUB_SHA" --latest
          echo "::notice title=Released::Game Repo $V"
      - name: The version's heading in CHANGELOG.md
        # what was just published under Unreleased gets its version's heading on main, so the
        # next release's notes start empty (review M46); a push with this token starts no run
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          [ -s unreleased.md ] || { echo "Nothing was under Unreleased."; exit 0; }
          git fetch -q origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- CHANGELOG.md; then
            echo "::warning title=Changelog::CHANGELOG.md changed on main after this build: the next pull request gives Unreleased its heading"
            exit 0
          fi
          git checkout -q -B main FETCH_HEAD
          awk -v h="## $V ($(date -u +%Y-%m-%d))" '!done && /^## Unreleased[[:space:]]*$/ { print; print ""; print h; done = 1; next } { print }' CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qam "CHANGELOG.md: $V is published"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main \
            || echo "::warning title=Changelog::couldn't push the heading: the next pull request gives Unreleased its heading"
