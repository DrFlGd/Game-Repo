[package]
name = "gamerepo-update"
description = "Updates for Game Repo, Game Repo Server and Game Repo Go on Windows and Linux: the newest release's update file read from GitHub, its installer checked against the key built in, and installed on a click"
version.workspace = true
edition.workspace = true

[dependencies]
serde_json = "1"
tauri = "2"
# its Windows installer run and its AppImage replaced, after checking the signature
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { version = "1", features = ["time"] }
gamerepo-wire = { path = "../wire" }
# the key that signs updates, made once by tools/updater_key.cmd (as tauri-cli makes it)
base64 = "0.22"
minisign = "0.9"

[dev-dependencies]
# what the updater checks a signature with
minisign-verify = "0.3"
