[package]
name = "gamerepo-device"
description = "A device's side of Game Repo Server, and Game Repo Go's backend: pairing, the catalogue kept on the device, the queue, what ES-DE has on the device, and removing games safely"
version.workspace = true
edition.workspace = true

[lib]
name = "gamerepo_device"

[dependencies]
anyhow = "1"
# Atlas's own reader of pack files (D222 revised): before Game Repo Go replaces a pack on a
# device, both descriptions are read and an older pack is never put over a newer one. The
# same tag as gamerepo-core's; its ZIP reading is pure Rust (zlib-rs), so it builds for
# Android too.
atlas-pack = { git = "https://github.com/DrFlGd/Atlas", tag = "v0.26.0" }
base64 = "0.22"
crc32fast = "1"
gamerepo-steam = { path = "../steam" }
gamerepo-wire = { path = "../wire" }
fs4 = "1"
hex = "0.4"
mdns-sd = "=0.21.4"
# Game Repo Go's updates on Android checked as the updater checks them (D139)
minisign-verify = "0.3"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
# Install Atlas (D260): Atlas's latest.json and its installer or AppImage fetched from its
# GitHub releases, as gamerepo-core fetches its downloads (rustls, the proxy from the
# environment)
ureq = "3"

[target.'cfg(windows)'.dependencies]
# Show in Atlas (D224): the program registered for .atlaspack files read from the registry
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }

[dev-dependencies]
# writes made-up packs for the tests of Go's rule (never an older pack over a newer one)
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# signs as the Tauri CLI signs, for the update tests
minisign = "0.9"
