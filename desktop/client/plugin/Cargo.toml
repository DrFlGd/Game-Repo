[package]
name = "tauri-plugin-gamerepo-device"
description = "Game Repo Go's Android side: All files access, storage volumes, the Keystore, multicast, the downloads' service and controllers"
version.workspace = true
edition.workspace = true
links = "tauri-plugin-gamerepo-device"

[lib]
name = "tauri_plugin_gamerepo_device"

[dependencies]
serde = "1"
serde_json = "1"
tauri = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
